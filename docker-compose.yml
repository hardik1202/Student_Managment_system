services:
  mongodb:
    image: mongo:7
    volumes:
      - sms-data:/data/db
    networks:
      - app-network

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/studentdb
      JWT_SECRET: docker_lab_secret
      DEMO_EMAIL: demo@charusat.edu
      DEMO_PASSWORD: Student@123
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - app-network

  frontend:
    build:
      context: ./Student_Management_system
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network

volumes:
  sms-data:

networks:
  app-network:
    driver: bridge
